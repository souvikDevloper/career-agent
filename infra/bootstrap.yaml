AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time bootstrap for Career Agent CI/CD - GitHub OIDC identity provider, a deploy role that only the
  souvikDevloper/career-agent repository's main branch can assume, and an encrypted artifacts bucket.

Parameters:
  GitHubRepo:
    Type: String
    Default: souvikDevloper/career-agent
    Description: Only used for documentation; the trust policy matches SubjectClaimPrefix.
  SubjectClaimPrefix:
    Type: String
    Default: "repo:souvikDevloper@138186578/career-agent@1373901075"
    Description: >
      The sub-claim prefix GitHub actually puts in the OIDC token. Repositories with
      immutable subject claims (the default for new repos) embed the numeric owner and
      repository ids, so this is NOT simply "repo:<owner>/<repo>". Read the real value with:
      gh api repos/<owner>/<repo>/actions/oidc/customization/sub --jq .sub_claim_prefix
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
  AppStackName:
    Type: String
    Default: career-agent

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules: [{ Id: expire, Status: Enabled, ExpirationInDays: 14 }]

  DeployRole:
    Type: AWS::IAM::Role
    DependsOn: GitHubOidc
    Properties:
      RoleName: gha-career-agent-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "${SubjectClaimPrefix}:ref:refs/heads/main"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: scoped-iam-for-app-stack
          PolicyDocument:
            Statement:
              - Sid: ManageOnlyAppRoles
                Effect: Allow
                Action: [iam:CreateRole, iam:DeleteRole, iam:GetRole, iam:PassRole, iam:TagRole, iam:UntagRole,
                         iam:PutRolePolicy, iam:DeleteRolePolicy, iam:GetRolePolicy, iam:AttachRolePolicy,
                         iam:DetachRolePolicy, iam:UpdateAssumeRolePolicy, iam:ListRolePolicies, iam:ListAttachedRolePolicies]
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*"
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  ArtifactsBucket:
    Value: !Ref ArtifactsBucket
