<!doctype html>
<!-- Shaped after a live job-boards.greenhouse.io form: the text inputs carry only
     an id, the file input is visually hidden, and the multi-select uses name="...[]".
     The identifiers are exactly what the public questions API returns. -->
<html>
  <body>
    <form method="post" action="/twilio/jobs/8177722" id="application-form" class="application--form">
      <label for="first_name">First Name</label>
      <input id="first_name" type="text" required />
      <label for="last_name">Last Name</label>
      <input id="last_name" type="text" required />
      <label for="email">Email</label>
      <input id="email" type="text" required />
      <label for="phone">Phone</label>
      <input id="phone" type="text" required />
      <input id="resume" class="visually-hidden" type="file" accept=".pdf,.doc,.docx" />
      <label for="question_68976768">Are you legally authorised to work?</label>
      <select id="question_68976768">
        <option value="">Select...</option>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>
      <label for="question_68976769">How did you hear about this job?</label>
      <select name="question_68976769[]" id="question_68976769">
        <option value="">Select...</option>
        <option value="7">Company Website</option>
        <option value="8">LinkedIn</option>
      </select>
      <label for="cover_letter_text">Why this role?</label>
      <textarea id="cover_letter_text"></textarea>
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
