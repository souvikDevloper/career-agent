[project]
name = "career-agent"
version = "1.0.0"
requires-python = ">=3.12"
description = "Career Agent backend: agentic job search, explained matching, authorized submissions."

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S101", "S311", "E501", "B008", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
