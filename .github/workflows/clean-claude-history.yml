name: Clean Claude attribution history

on:
  push:
    branches:
      - chore/clean-claude-history-20260923

permissions:
  contents: write

jobs:
  rewrite-history:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rewrite attribution metadata and publish candidate
        env:
          FILTER_BRANCH_SQUELCH_WARNING: "1"
          BASE_SHA: "7a4dc82d8d6353656c60fa41074fd69d504dfe7b"
          OUTPUT_BRANCH: "history/claude-cleaned-20260923"
        shell: bash
        run: |
          set -euo pipefail

          BASE_TREE="$(git rev-parse "$BASE_SHA^{tree}")"

          git filter-branch --force \
            --msg-filter 'grep -viE "^(Co-Authored-By: Claude Opus 5 <noreply@anthropic\.com>|Claude-Session:)" || true' \
            -- "$GITHUB_REF_NAME"

          git config user.name "Souvik Ghosh"
          git config user.email "138186578+souvikDevloper@users.noreply.github.com"

          git rm .github/workflows/clean-claude-history.yml
          git commit -m "chore: finalize attribution history cleanup"

          CLEAN_TREE="$(git rev-parse HEAD^{tree})"
          if [[ "$CLEAN_TREE" != "$BASE_TREE" ]]; then
            echo "Tree mismatch: cleanup altered repository contents."
            echo "Expected: $BASE_TREE"
            echo "Actual:   $CLEAN_TREE"
            exit 1
          fi

          if git log --format=%B | grep -qiE 'Co-Authored-By: Claude Opus 5 <noreply@anthropic\.com>|Claude-Session:'; then
            echo "Claude attribution metadata still exists in rewritten history."
            exit 1
          fi

          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH" --force
